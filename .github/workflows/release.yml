name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      # The Linux ffmpeg and OCR bundles are built from Alpine packages for each architecture.
      - uses: docker/setup-qemu-action@v3
      - name: Build, checksum and sign archives for every platform
        env:
          ALCOVE_SIGNING_KEY: ${{ secrets.ALCOVE_SIGNING_KEY }}
          FFMPEG_BUNDLES: "1"
        run: |
          test -n "$ALCOVE_SIGNING_KEY" || { echo "ALCOVE_SIGNING_KEY secret missing"; exit 1; }
          scripts/dist.sh "${GITHUB_REF_NAME#v}"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The Android app, signed with the Alcove release key (secrets), attached to every release.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.44.8, cache: true }
      - name: Build the signed APK
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ALCOVE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          export ALCOVE_ANDROID_KEYSTORE="$RUNNER_TEMP/alcove.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$ALCOVE_ANDROID_KEYSTORE"
          flutter pub get
          flutter build apk --release
          mkdir -p ../dist-android
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-android/alcove-android.apk
          rm -f "$ALCOVE_ANDROID_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android/
          retention-days: 7

  publish:
    needs: [binaries, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/paul-carouge/alcove
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.authors=Paul Carouge
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - name: GitHub release from the CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          devlog=$(ls docs/devlog/*-v"$V".md 2>/dev/null | head -1)
          [ -n "$devlog" ] && printf '\n---\nThe story behind this release: [devlog](%s)\n\n**Docker:** `ghcr.io/paul-carouge/alcove:%s`\n' \
            "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${devlog}" "$V" >> notes.md
          printf '\n**Install:** `curl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh`\n' "$GITHUB_REPOSITORY" >> notes.md
          printf '\n**Android app:** [alcove-android.apk](https://github.com/%s/releases/download/%s/alcove-android.apk)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "Alcove $GITHUB_REF_NAME" --notes-file notes.md dist/*
