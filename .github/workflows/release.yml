name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/paul-carouge/alcove
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.authors=Paul Carouge
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release from the CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          devlog=$(ls docs/devlog/*-v"$V".md 2>/dev/null | head -1)
          [ -n "$devlog" ] && printf '\n---\nThe story behind this release: [devlog](%s)\n\n**Docker:** `ghcr.io/paul-carouge/alcove:%s`\n' \
            "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${devlog}" "$V" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "Alcove $GITHUB_REF_NAME" --notes-file notes.md
