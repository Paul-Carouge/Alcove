include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/l10n/gen/**
  language:
    strict-casts: true
    strict-raw-types: true

formatter:
  page_width: 100
  trailing_commas: preserve

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_locals
    - unawaited_futures
