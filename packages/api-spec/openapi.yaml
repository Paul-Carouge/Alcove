openapi: 3.1.0
info:
  title: Alcove API
  version: 1.0.0
  summary: Custom HTTP endpoints of the Alcove server.
  description: |
    This document is the contract for every endpoint the Alcove server adds on
    top of PocketBase. Built-in PocketBase routes (`/api/collections/*`,
    `/api/realtime`, auth) are documented by PocketBase and are not repeated here.

    Versioning: `info.version` major == API version advertised by `/health`
    (`api.max`). Custom endpoints live under `/api/v{N}/`. A breaking change
    bumps N; the server keeps serving N-1 until `api.min` is raised.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8090
    description: Local development server
tags:
  - name: system
    description: Server metadata and compatibility.
  - name: drive
    description: Drive operations not covered by PocketBase's collection API.
  - name: shares
    description: |
      Public links to a file or folder. The link token is shown once at creation; the server
      only stores its SHA-256. Owners list and revoke their links through the PocketBase
      `shares` collection (`GET /api/collections/shares/records`, `DELETE …/{id}`).
  - name: public
    description: Unauthenticated access through a share link (rate limited).
  - name: uploads
    description: |
      Resumable uploads using the [tus 1.0 protocol](https://tus.io/protocols/resumable-upload)
      (core + creation + termination), see ADR 0011. Use a tus client (tus-js-client, …)
      rather than calling these endpoints by hand. When the last chunk is stored, the server
      creates the drive node and returns its id in `Alcove-Node-Id`. If the name is taken in
      the target folder, the node is renamed (`name (2).ext`).
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Server health, version and compatibility information.
      description: |
        Unauthenticated. Clients call it when the user enters a server URL and
        on every app start, then refuse to continue if their own supported API
        version is outside `[api.min, api.max]`.
      security: []
      responses:
        "200":
          description: Server is up.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                name: Alcove
                version: 0.1.0
                api: { min: 1, max: 1 }
                modules: [core]
                setupRequired: false
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/shares:
    post:
      tags: [shares]
      operationId: createShare
      summary: Create a public link to one of your files or folders.
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShare" }
      responses:
        "201":
          description: Link created. `token` is returned only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedShare" }
        "400": { description: "Invalid node, expiry or password." }
        "401": { description: Authentication required. }
  /api/v1/public/shares/{token}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
      - $ref: "#/components/parameters/ShareAccess"
    get:
      tags: [public]
      operationId: getPublicShare
      summary: Describe a shared item (and list a shared folder's content).
      security: []
      parameters:
        - name: folder
          in: query
          required: false
          description: "Folder inside a shared folder to list (default: the shared folder itself)."
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Shared item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicShare" }
        "401":
          description: Password required (or wrong/expired access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: "Unknown or revoked link, or folder outside the share." }
        "410": { description: Link expired. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/public/shares/{token}/unlock:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    post:
      tags: [public]
      operationId: unlockShare
      summary: Exchange the link password for a 1-hour access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Access granted.
          content:
            application/json:
              schema:
                type: object
                required: [access, expiresAt]
                properties:
                  access: { type: string, description: "Pass as `access` query parameter." }
                  expiresAt: { type: string, format: date-time }
        "401": { description: Wrong password. }
        "404": { description: Unknown or revoked link. }
        "410": { description: Link expired. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/public/shares/{token}/files/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
      - name: nodeId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - $ref: "#/components/parameters/ShareAccess"
      - name: inline
        in: query
        required: false
        description: Same passive-type rules as `/api/v1/nodes/{nodeId}/download`.
        schema: { type: string, enum: ["1"] }
    get:
      tags: [public]
      operationId: downloadSharedFile
      summary: Download (or display) a file that is the shared item or inside the shared folder.
      security: []
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Password required. }
        "404": { description: "Not a file within this share." }
        "410": { description: Link expired. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/uploads/:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Start a resumable upload (tus creation).
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/TusResumable"
        - name: Upload-Length
          in: header
          required: true
          description: Total size in bytes (deferred length is not supported). Max 64 GiB.
          schema: { type: integer, minimum: 0, maximum: 68719476736 }
        - name: Upload-Metadata
          in: header
          required: true
          description: |
            tus metadata (comma-separated `key base64(value)` pairs). Keys: `filename` (required,
            a valid node name), `parent` (optional, id of a folder owned by the caller; empty = root).
            Other keys are ignored.
          schema: { type: string, example: "filename aGVsbG8udHh0,parent " }
      responses:
        "201":
          description: Upload created.
          headers:
            Location:
              description: Absolute URL of the upload resource.
              schema: { type: string, format: uri }
        "400": { description: "Invalid name, parent, or missing length." }
        "401": { description: Authentication required. }
        "413": { description: File larger than the server limit. }
  /api/v1/uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    head:
      tags: [uploads]
      operationId: getUploadOffset
      summary: Get the current offset of an upload (to resume).
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/TusResumable"
      responses:
        "200":
          description: Upload state.
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
        "404": { description: "Unknown upload, or owned by another user." }
    patch:
      tags: [uploads]
      operationId: appendUpload
      summary: Append a chunk (max 64 MiB per request).
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/TusResumable"
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Chunk stored. On the last chunk, the node has been created.
          headers:
            Upload-Offset: { schema: { type: integer } }
            Alcove-Node-Id:
              description: Id of the created drive node (last chunk only).
              schema: { type: string }
        "404": { description: "Unknown upload, or owned by another user." }
        "409": { description: "Offset mismatch, or the target folder no longer exists." }
    delete:
      tags: [uploads]
      operationId: cancelUpload
      summary: Cancel an upload and delete its partial data.
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/TusResumable"
      responses:
        "204": { description: Upload cancelled. }
        "404": { description: "Unknown upload, or owned by another user." }
  /api/v1/nodes/{nodeId}/download:
    get:
      tags: [drive]
      operationId: downloadNode
      summary: Download a file under its drive name.
      description: |
        Authenticated with a short-lived **file token** in the query string (from PocketBase
        `POST /api/files/token`), so the URL can be used in a plain link (or `<img>`/`<video>`).
        Served as an attachment unless `inline=1` for a passive type; supports Range requests.
      security: []
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
        - name: token
          in: query
          required: true
          description: File token of the node's owner (expires after a few minutes).
          schema: { type: string }
        - name: inline
          in: query
          required: false
          description: |
            `1` to display instead of download. Only honored for passive types (JPEG, PNG, GIF,
            WebP, AVIF, PDF, plain text, MP4/WebM video, common audio); everything else, notably
            HTML and SVG, is always an attachment. Inline responses carry a restrictive CSP.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: File content.
          headers:
            Content-Disposition:
              description: '`attachment` (or `inline`) with the node name (RFC 2231 `filename*` for non-ASCII).'
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: "Missing, expired or non-file token." }
        "404": { description: "Not a file, or not owned by the token's user." }
components:
  securitySchemes:
    userToken:
      type: apiKey
      in: header
      name: Authorization
      description: PocketBase auth token of a `users` record (raw token, no "Bearer" prefix).
  parameters:
    ShareToken:
      name: token
      in: path
      required: true
      description: The link token (43 URL-safe characters).
      schema: { type: string, minLength: 16, maxLength: 128 }
    ShareAccess:
      name: access
      in: query
      required: false
      description: Access token from `unlock` (password-protected links only).
      schema: { type: string, maxLength: 2048 }
    TusResumable:
      name: Tus-Resumable
      in: header
      required: true
      schema: { type: string, enum: ["1.0.0"] }
  responses:
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, name, version, api, modules, setupRequired]
      properties:
        status:
          type: string
          enum: [ok]
        name:
          type: string
          description: Product name (branding), e.g. "Alcove".
          maxLength: 64
        version:
          type: string
          description: Server version (SemVer).
          maxLength: 64
          example: 0.1.0
        api:
          $ref: "#/components/schemas/ApiRange"
        modules:
          type: array
          description: Active modules. `core` is always present.
          items:
            $ref: "#/components/schemas/Module"
        setupRequired:
          type: boolean
          description: True until the first administrator account has been created.
    ApiRange:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: integer
          minimum: 1
          description: Oldest API version the server still serves.
        max:
          type: integer
          minimum: 1
          description: Newest API version the server serves.
    Module:
      type: string
      enum: [core, drive, photos, documents, ocr, faces, notes, calendar, contacts]
    CreateShare:
      type: object
      additionalProperties: false
      required: [node]
      properties:
        node: { type: string, maxLength: 64, description: "Id of a file or folder you own (not trashed)." }
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry, in the future and at most one year ahead.
        password:
          type: string
          minLength: 4
          maxLength: 256
          description: Optional password visitors must enter.
    CreatedShare:
      type: object
      required: [id, token, expiresAt, hasPassword]
      properties:
        id: { type: string }
        token: { type: string, description: "Secret link token. Shown only once." }
        expiresAt: { type: [string, "null"], format: date-time }
        hasPassword: { type: boolean }
    PublicNode:
      type: object
      required: [id, name, kind, size, mime, updated]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [file, folder] }
        size: { type: integer }
        mime: { type: string }
        updated: { type: string }
    PublicShare:
      type: object
      required: [item, expiresAt]
      properties:
        item: { $ref: "#/components/schemas/PublicNode" }
        expiresAt: { type: [string, "null"], format: date-time }
        folder:
          description: The folder being listed (shared folders only).
          allOf: [{ $ref: "#/components/schemas/PublicNode" }]
        path:
          type: array
          description: Folders from the shared root down to `folder`.
          items: { $ref: "#/components/schemas/PublicNode" }
        children:
          type: array
          items: { $ref: "#/components/schemas/PublicNode" }
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          type: object
          additionalProperties: true
