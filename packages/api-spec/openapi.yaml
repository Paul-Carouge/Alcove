openapi: 3.1.0
info:
  title: Alcove API
  version: 1.0.0
  summary: Custom HTTP endpoints of the Alcove server.
  description: |
    This document is the contract for every endpoint the Alcove server adds on
    top of PocketBase. Built-in PocketBase routes (`/api/collections/*`,
    `/api/realtime`, auth) are documented by PocketBase and are not repeated here.

    Versioning: `info.version` major == API version advertised by `/health`
    (`api.max`). Custom endpoints live under `/api/v{N}/`. A breaking change
    bumps N; the server keeps serving N-1 until `api.min` is raised.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8090
    description: Local development server
tags:
  - name: system
    description: Server metadata and compatibility.
  - name: drive
    description: Drive operations not covered by PocketBase's collection API.
  - name: shares
    description: |
      Public links to a file or folder. The link token is shown once at creation; the server
      only stores its SHA-256. Owners list and revoke their links through the PocketBase
      `shares` collection (`GET /api/collections/shares/records`, `DELETE …/{id}`).
  - name: public
    description: Unauthenticated access through a share link (rate limited).
  - name: account
    description: |
      Two-factor authentication with an authenticator app (TOTP, RFC 6238). Once enabled, signing in
      with `POST /api/collections/users/auth-with-password` requires an extra body field `totp`
      (6-digit code or recovery code); without it the server answers 401 with
      `data.totpRequired = true`.
  - name: setup
    description: |
      First-run wizard. Available only while no administrator exists, and only with the one-time
      setup token printed in the server logs (or preset with `ALCOVE_SETUP_TOKEN`).
  - name: photos
    description: |
      Photos and videos. Every image or video in the drive gets a record in the PocketBase `media`
      collection (date taken, dimensions, camera, location, duration, generated thumbnails), filled in
      by a background worker. Read it with `GET /api/collections/media/records` (owner only); the
      timeline sorts by `-taken_at`. Only `favorite` can be changed by users, through this API.
      Albums (`albums`, `album_items` collections) can be shared with other accounts as viewers or
      contributors (ADR 0018); participants read shared items through the `media` view rule.
  - name: admin
    description: Server administration, for accounts with `role = admin` (ADR 0015).
  - name: uploads
    description: |
      Resumable uploads using the [tus 1.0 protocol](https://tus.io/protocols/resumable-upload)
      (core + creation + termination), see ADR 0011. Use a tus client (tus-js-client, …)
      rather than calling these endpoints by hand. When the last chunk is stored, the server
      creates the drive node and returns its id in `Alcove-Node-Id`. If the name is taken in
      the target folder, the node is renamed (`name (2).ext`).
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Server health, version and compatibility information.
      description: |
        Unauthenticated. Clients call it when the user enters a server URL and
        on every app start, then refuse to continue if their own supported API
        version is outside `[api.min, api.max]`.
      security: []
      responses:
        "200":
          description: Server is up.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                name: Alcove
                version: 0.1.0
                api: { min: 1, max: 1 }
                modules: [core]
                setupRequired: false
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/shares:
    post:
      tags: [shares]
      operationId: createShare
      summary: Create a public link to one of your files, folders or albums.
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShare" }
      responses:
        "201":
          description: Link created. `token` is returned only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedShare" }
        "400": { description: "Invalid node or album, expiry or password." }
        "401": { description: Authentication required. }
  /api/v1/public/shares/{token}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
      - $ref: "#/components/parameters/ShareAccess"
    get:
      tags: [public]
      operationId: getPublicShare
      summary: Describe a shared item (and list a shared folder's or album's content).
      security: []
      parameters:
        - name: folder
          in: query
          required: false
          description: "Folder inside a shared folder to list (default: the shared folder itself)."
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Shared item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicShare" }
        "401":
          description: Password required (or wrong/expired access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: "Unknown or revoked link, or folder outside the share." }
        "410": { description: Link expired. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/public/shares/{token}/unlock:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    post:
      tags: [public]
      operationId: unlockShare
      summary: Exchange the link password for a 1-hour access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Access granted.
          content:
            application/json:
              schema:
                type: object
                required: [access, expiresAt]
                properties:
                  access: { type: string, description: "Pass as `access` query parameter." }
                  expiresAt: { type: string, format: date-time }
        "401": { description: Wrong password. }
        "404": { description: Unknown or revoked link. }
        "410": { description: Link expired. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/public/shares/{token}/media/{mediaId}/{variant}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
      - $ref: "#/components/parameters/ShareAccess"
      - name: mediaId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - name: variant
        in: path
        required: true
        description: |
          `thumb` (360 px high) and `preview` (1600 px) are generated JPEGs without metadata. `video`
          streams the original video (Range requests supported). Original photos are never served.
        schema: { type: string, enum: [thumb, preview, video] }
    get:
      tags: [public]
      operationId: getSharedMedia
      summary: An image or video of a shared album.
      security: []
      responses:
        "200":
          description: The file.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "206": { description: Partial content (video). }
        "401": { description: Password required. }
        "404": { description: "Unknown link, item not in the album or in the trash, or not ready yet." }
        "410": { description: Link expired. }
  /api/v1/public/shares/{token}/files/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
      - name: nodeId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - $ref: "#/components/parameters/ShareAccess"
      - name: inline
        in: query
        required: false
        description: Same passive-type rules as `/api/v1/nodes/{nodeId}/download`.
        schema: { type: string, enum: ["1"] }
    get:
      tags: [public]
      operationId: downloadSharedFile
      summary: Download (or display) a file that is the shared item or inside the shared folder.
      security: []
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Password required. }
        "404": { description: "Not a file within this share." }
        "410": { description: Link expired. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/uploads/:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Start a resumable upload (tus creation).
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/TusResumable"
        - name: Upload-Length
          in: header
          required: true
          description: Total size in bytes (deferred length is not supported). Max 64 GiB.
          schema: { type: integer, minimum: 0, maximum: 68719476736 }
        - name: Upload-Metadata
          in: header
          required: true
          description: |
            tus metadata (comma-separated `key base64(value)` pairs). Keys: `filename` (required,
            a valid node name), `parent` (optional, id of a folder owned by the caller; empty = root).
            Other keys are ignored.
          schema: { type: string, example: "filename aGVsbG8udHh0,parent " }
      responses:
        "201":
          description: Upload created.
          headers:
            Location:
              description: Absolute URL of the upload resource.
              schema: { type: string, format: uri }
        "400": { description: "Invalid name, parent, or missing length." }
        "401": { description: Authentication required. }
        "413": { description: "File larger than the server limit, or than the space left in the user's quota (body starts with ERR_QUOTA_EXCEEDED)." }
  /api/v1/uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    head:
      tags: [uploads]
      operationId: getUploadOffset
      summary: Get the current offset of an upload (to resume).
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/TusResumable"
      responses:
        "200":
          description: Upload state.
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
        "404": { description: "Unknown upload, or owned by another user." }
    patch:
      tags: [uploads]
      operationId: appendUpload
      summary: Append a chunk (max 64 MiB per request).
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/TusResumable"
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Chunk stored. On the last chunk, the node has been created.
          headers:
            Upload-Offset: { schema: { type: integer } }
            Alcove-Node-Id:
              description: Id of the created drive node (last chunk only).
              schema: { type: string }
        "404": { description: "Unknown upload, or owned by another user." }
        "409": { description: "Offset mismatch, or the target folder no longer exists." }
        "413": { description: "The quota was exceeded meanwhile (ERR_QUOTA_EXCEEDED); the upload is discarded." }
    delete:
      tags: [uploads]
      operationId: cancelUpload
      summary: Cancel an upload and delete its partial data.
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/TusResumable"
      responses:
        "204": { description: Upload cancelled. }
        "404": { description: "Unknown upload, or owned by another user." }
  /api/v1/me/usage:
    get:
      tags: [drive]
      operationId: getMyUsage
      summary: Storage used by the signed-in user, and their quota.
      security:
        - userToken: []
      responses:
        "200":
          description: Usage in bytes. Trashed files count until they are purged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "401": { description: Authentication required. }
  /api/v1/setup/status:
    post:
      tags: [setup]
      operationId: getSetupStatus
      summary: Check the setup token and the storage before creating the administrator.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupToken" }
      responses:
        "200":
          description: Token accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "403": { description: Invalid setup token. }
        "409": { description: Setup is already complete. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/setup/smtp-test:
    post:
      tags: [setup]
      operationId: testSetupSmtp
      summary: Send a test email with SMTP settings (not saved).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SetupToken" }
                - type: object
                  required: [smtp, to]
                  properties:
                    smtp: { $ref: "#/components/schemas/SmtpSettings" }
                    to: { type: string, format: email, maxLength: 254 }
      responses:
        "204": { description: Test email sent. }
        "400":
          description: The SMTP server rejected the settings (message explains why).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { description: Invalid setup token. }
        "409": { description: Setup is already complete. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/setup:
    post:
      tags: [setup]
      operationId: completeSetup
      summary: Create the administrator (admin UI + app account) and save optional settings.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SetupToken" }
                - type: object
                  required: [admin]
                  properties:
                    admin:
                      type: object
                      required: [email, password]
                      properties:
                        name: { type: string, maxLength: 100 }
                        email: { type: string, format: email, maxLength: 254 }
                        password: { type: string, minLength: 10, maxLength: 256 }
                    smtp: { $ref: "#/components/schemas/SmtpSettings" }
      responses:
        "204": { description: "Setup complete; sign in with the new credentials." }
        "400": { description: Invalid data. }
        "403": { description: Invalid setup token. }
        "409": { description: Setup is already complete. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/admin/system:
    get:
      tags: [admin]
      operationId: getSystem
      summary: Version, installation and update status.
      security:
        - userToken: []
      responses:
        "200":
          description: System information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { description: Authentication required. }
        "403": { description: Administrators only. }
  /api/v1/admin/updates/check:
    post:
      tags: [admin]
      operationId: checkUpdates
      summary: Check for a new release now.
      security:
        - userToken: []
      responses:
        "200":
          description: Updated status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { description: Authentication required. }
        "403": { description: Administrators only. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/admin/updates/apply:
    post:
      tags: [admin]
      operationId: applyUpdate
      summary: Install the latest release and restart (native installs only).
      description: |
        Downloads the release, verifies its signature and checksum, backs up the database, swaps the
        binary and exits so the service manager restarts the new version. Answers 202 once the new
        binary is in place; clients then poll `/health` until `version` changes.
      security:
        - userToken: []
      responses:
        "202":
          description: Installed; the server restarts now.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string, description: Version being started. }
        "400": { description: "No update available, or this installation cannot update itself (Docker, manual)." }
        "401": { description: Authentication required. }
        "403": { description: Administrators only. }
        "502":
          description: The release could not be downloaded or verified (nothing was changed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/me/totp:
    get:
      tags: [account]
      operationId: getTotpStatus
      summary: Two-factor status of the signed-in user.
      security:
        - userToken: []
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpStatus" }
        "401": { description: Authentication required. }
  /api/v1/me/totp/setup:
    post:
      tags: [account]
      operationId: setupTotp
      summary: Start enrolment (new secret, not active until confirmed).
      security:
        - userToken: []
      responses:
        "200":
          description: Secret to add to an authenticator app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        "401": { description: Authentication required. }
        "409": { description: Two-factor is already enabled. }
  /api/v1/me/totp/enable:
    post:
      tags: [account]
      operationId: enableTotp
      summary: Confirm enrolment with a first code; returns recovery codes once.
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { description: "Invalid code, or no pending enrolment." }
        "401": { description: Authentication required. }
  /api/v1/me/totp/disable:
    post:
      tags: [account]
      operationId: disableTotp
      summary: Turn two-factor off (password and a code required).
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpConfirm" }
      responses:
        "204": { description: Disabled. }
        "400": { description: Wrong password or code. }
        "401": { description: Authentication required. }
  /api/v1/me/totp/recovery-codes:
    post:
      tags: [account]
      operationId: regenerateRecoveryCodes
      summary: Replace all recovery codes (password and a code required).
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpConfirm" }
      responses:
        "200":
          description: New codes, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { description: "Wrong password or code, or two-factor is not enabled." }
        "401": { description: Authentication required. }
  /api/v1/media/{mediaId}/favorite:
    put:
      tags: [photos]
      operationId: setFavorite
      summary: Mark or unmark a photo or video as favorite.
      security:
        - userToken: []
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite: { type: boolean }
      responses:
        "204": { description: Saved. }
        "401": { description: Authentication required. }
        "404": { description: "Unknown media, or owned by another user." }
  /api/v1/media/{mediaId}/original:
    get:
      tags: [photos]
      operationId: getMediaOriginal
      summary: The original file of a photo or video, for its owner and the people of albums it is in.
      description: |
        Authenticated with a short-lived **file token** in the query string, like
        `/api/v1/nodes/{nodeId}/download`. Access follows the `media` view rule (ADR 0018), so album
        participants can play or download a shared item without access to the owner's drive.
        Attachment unless `inline=1` for a passive type; supports Range requests.
      security: []
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: inline
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Partial content (Range request). }
        "401": { description: Missing or invalid file token. }
        "404": { description: "Unknown item, in the trash, or not visible to this account." }
  /api/v1/photos/duplicates:
    get:
      tags: [photos]
      operationId: listDuplicates
      summary: Groups of identical files and visually similar photos among your own items.
      description: |
        Identical = same SHA-256. Similar = images whose perceptual hashes (dHash) differ by at most a few
        bits (resized or recompressed copies, bursts). Items in the trash and groups you dismissed are left
        out. Nothing is deleted by the server: clients move the unwanted files to the trash.
      security:
        - userToken: []
      responses:
        "200":
          description: The groups, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/DuplicateGroup" }
        "401": { description: Authentication required. }
  /api/v1/photos/duplicates/dismiss:
    post:
      tags: [photos]
      operationId: dismissDuplicates
      summary: Mark a group as "not duplicates"; it is hidden until another similar photo joins it.
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 2
                  maxItems: 1000
                  items: { type: string, maxLength: 64 }
                  description: Media ids of the group (all yours).
      responses:
        "204": { description: Dismissed. }
        "400": { description: "Fewer than two items, or items that are not yours." }
        "401": { description: Authentication required. }
  /api/v1/albums:
    get:
      tags: [photos]
      operationId: listAlbums
      summary: Albums the caller owns or takes part in, most recently updated first.
      description: |
        Albums are created, renamed, shared and deleted through the `albums` collection
        (`/api/collections/albums/records`); items are added and removed through `album_items`.
        This read adds what collection rules cannot: item counts, covers and the owner's name.
      security:
        - userToken: []
      responses:
        "200":
          description: The albums.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumSummary" }
        "401": { description: Authentication required. }
  /api/v1/albums/{albumId}/items:
    get:
      tags: [photos]
      operationId: listAlbumItems
      summary: Photos and videos of an album, newest first (items in the trash are left out).
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/AlbumId"
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: A page of items.
          content:
            application/json:
              schema:
                type: object
                required: [page, perPage, totalItems, items]
                properties:
                  page: { type: integer }
                  perPage: { type: integer }
                  totalItems: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
        "401": { description: Authentication required. }
        "404": { description: "Unknown album, or not shared with this account." }
  /api/v1/albums/{albumId}/people:
    get:
      tags: [photos]
      operationId: getAlbumPeople
      summary: The owner and participants of an album.
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/AlbumId"
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema:
                type: object
                required: [owner, people]
                properties:
                  owner: { $ref: "#/components/schemas/Person" }
                  people:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Person"
                        - type: object
                          required: [role]
                          properties:
                            role: { type: string, enum: [viewer, contributor] }
        "401": { description: Authentication required. }
        "404": { description: "Unknown album, or not shared with this account." }
  /api/v1/albums/{albumId}/leave:
    post:
      tags: [photos]
      operationId: leaveAlbum
      summary: Stop taking part in an album shared with you (your photos are removed from it).
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/AlbumId"
      responses:
        "204": { description: Left. }
        "400": { description: The owner cannot leave their own album. }
        "401": { description: Authentication required. }
        "404": { description: "Unknown album, or not shared with this account." }
  /api/v1/users/lookup:
    get:
      tags: [account]
      operationId: lookupUser
      summary: Find an account of this server by exact email, to share an album with it.
      security:
        - userToken: []
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { description: Invalid email. }
        "401": { description: Authentication required. }
        "404": { description: No account with this email (or it is your own). }
  /api/v1/nodes/{nodeId}/download:
    get:
      tags: [drive]
      operationId: downloadNode
      summary: Download a file under its drive name.
      description: |
        Authenticated with a short-lived **file token** in the query string (from PocketBase
        `POST /api/files/token`), so the URL can be used in a plain link (or `<img>`/`<video>`).
        Served as an attachment unless `inline=1` for a passive type; supports Range requests.
      security: []
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
        - name: token
          in: query
          required: true
          description: File token of the node's owner (expires after a few minutes).
          schema: { type: string }
        - name: inline
          in: query
          required: false
          description: |
            `1` to display instead of download. Only honored for passive types (JPEG, PNG, GIF,
            WebP, AVIF, PDF, plain text, MP4/WebM video, common audio); everything else, notably
            HTML and SVG, is always an attachment. Inline responses carry a restrictive CSP.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: File content.
          headers:
            Content-Disposition:
              description: '`attachment` (or `inline`) with the node name (RFC 2231 `filename*` for non-ASCII).'
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: "Missing, expired or non-file token." }
        "404": { description: "Not a file, or not owned by the token's user." }
components:
  securitySchemes:
    userToken:
      type: apiKey
      in: header
      name: Authorization
      description: PocketBase auth token of a `users` record (raw token, no "Bearer" prefix).
  parameters:
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    ShareToken:
      name: token
      in: path
      required: true
      description: The link token (43 URL-safe characters).
      schema: { type: string, minLength: 16, maxLength: 128 }
    ShareAccess:
      name: access
      in: query
      required: false
      description: Access token from `unlock` (password-protected links only).
      schema: { type: string, maxLength: 2048 }
    TusResumable:
      name: Tus-Resumable
      in: header
      required: true
      schema: { type: string, enum: ["1.0.0"] }
  responses:
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Person:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string, description: May be empty. }
        email: { type: string }
    AlbumSummary:
      type: object
      required: [id, name, role, owner, count, shared, cover, updated]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, contributor, viewer], description: The caller's role. }
        owner:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string, description: "The owner's name, or email when they have none." }
        count: { type: integer, description: Items not in the trash. }
        shared: { type: boolean, description: The album has participants. }
        cover:
          description: The chosen cover, or the newest item; null for an empty album.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/MediaFiles"
        updated: { type: string, format: date-time }
    MediaFiles:
      type: object
      description: Enough to build PocketBase file URLs (`/api/files/{collectionId}/{id}/{file}?token=`).
      required: [id, collectionId, thumb, preview]
      properties:
        id: { type: string }
        collectionId: { type: string }
        thumb: { type: string }
        preview: { type: string }
    DuplicateGroup:
      type: object
      required: [kind, keep, items]
      properties:
        kind: { type: string, enum: [identical, similar] }
        keep: { type: string, description: "Suggested item to keep (highest resolution, then largest file, then oldest upload)." }
        items:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/DuplicateItem" }
    DuplicateItem:
      allOf:
        - $ref: "#/components/schemas/MediaFiles"
        - type: object
          required: [node, kind, status, taken_at, width, height, duration, name, size, mime, created]
          properties:
            node: { type: string, description: Drive node id (to move it to the trash). }
            kind: { type: string, enum: [image, video] }
            status: { type: string, enum: [pending, ready, failed] }
            taken_at: { type: string }
            width: { type: integer }
            height: { type: integer }
            duration: { type: number }
            name: { type: string }
            size: { type: integer }
            mime: { type: string }
            created: { type: string, description: Upload date. }
    AlbumItem:
      allOf:
        - $ref: "#/components/schemas/MediaFiles"
        - type: object
          required: [itemId, addedBy, kind, status, taken_at, width, height, duration, favorite, name, size, mime]
          properties:
            itemId: { type: string, description: The album_items record (to remove it). }
            addedBy: { type: string, description: User id. }
            kind: { type: string, enum: [image, video] }
            status: { type: string, enum: [pending, ready, failed] }
            taken_at: { type: string }
            width: { type: integer }
            height: { type: integer }
            duration: { type: number }
            favorite: { type: boolean, description: The owner's favorite flag (false for others' photos). }
            camera_make: { type: string }
            camera_model: { type: string }
            lens: { type: string }
            exposure: { type: string }
            has_location: { type: boolean }
            lat: { type: number }
            lon: { type: number }
            name: { type: string, description: File name. }
            size: { type: integer }
            mime: { type: string }
    Health:
      type: object
      additionalProperties: false
      required: [status, name, version, api, modules, setupRequired]
      properties:
        status:
          type: string
          enum: [ok]
        name:
          type: string
          description: Product name (branding), e.g. "Alcove".
          maxLength: 64
        version:
          type: string
          description: Server version (SemVer).
          maxLength: 64
          example: 0.1.0
        api:
          $ref: "#/components/schemas/ApiRange"
        modules:
          type: array
          description: Active modules. `core` is always present.
          items:
            $ref: "#/components/schemas/Module"
        setupRequired:
          type: boolean
          description: True until the first administrator account has been created.
    ApiRange:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: integer
          minimum: 1
          description: Oldest API version the server still serves.
        max:
          type: integer
          minimum: 1
          description: Newest API version the server serves.
    Module:
      type: string
      enum: [core, drive, photos, documents, ocr, faces, notes, calendar, contacts]
    SystemInfo:
      type: object
      required: [version, installMode, canSelfUpdate, ffmpeg, update]
      properties:
        version: { type: string }
        installMode:
          type: string
          enum: [native, docker, manual]
          description: native = installed by `alcove install`; manual = started by hand.
        canSelfUpdate: { type: boolean, description: "The \"Update now\" button can be used." }
        updateCommand: { type: string, description: "Command to run on the host when self-update is not possible." }
        ffmpeg: { type: boolean, description: "ffmpeg is available (video and HEIC thumbnails)." }
        update:
          type: object
          required: [enabled, available]
          properties:
            enabled: { type: boolean, description: "Daily checks are on (ALCOVE_UPDATE_CHECK)." }
            available: { type: boolean }
            latest: { type: string }
            notes: { type: string, description: Release notes (Markdown). }
            url: { type: string }
            checkedAt: { type: string, format: date-time }
            error: { type: string, description: "Last check error, if any." }
    SetupToken:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 16, maxLength: 256 }
    SetupStatus:
      type: object
      required: [storage]
      properties:
        storage:
          type: object
          required: [type, writable]
          properties:
            type: { type: string, enum: [local, s3] }
            writable: { type: boolean, description: "A test file could be written, read and deleted." }
            error: { type: string, description: "Why the write test failed." }
    SmtpSettings:
      type: object
      required: [host, port, senderAddress]
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 256 }
        tls: { type: boolean, description: "Implicit TLS (usually port 465); STARTTLS is used otherwise when offered." }
        senderAddress: { type: string, format: email, maxLength: 254 }
        senderName: { type: string, maxLength: 100 }
    TotpStatus:
      type: object
      required: [enabled, recoveryCodesLeft]
      properties:
        enabled: { type: boolean }
        recoveryCodesLeft: { type: integer }
    TotpSetup:
      type: object
      required: [secret, otpauthUrl, qrCode]
      properties:
        secret: { type: string, description: "Base32 secret for manual entry." }
        otpauthUrl: { type: string, description: "otpauth:// URI (what the QR code encodes)." }
        qrCode: { type: string, description: "PNG data URL of the QR code." }
    TotpConfirm:
      type: object
      required: [password, code]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
        code: { type: string, description: "6-digit code or a recovery code.", maxLength: 32 }
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          description: Single-use codes, shown only in this response.
          items: { type: string }
    Usage:
      type: object
      required: [used, trash, quota]
      properties:
        used: { type: integer, description: "Bytes used, trash included." }
        trash: { type: integer, description: "Bytes in the trash (part of used)." }
        quota: { type: integer, description: "Quota in bytes; 0 means unlimited." }
    CreateShare:
      type: object
      additionalProperties: false
      description: Exactly one of `node` and `album`.
      properties:
        node: { type: string, maxLength: 64, description: "Id of a file or folder you own (not trashed)." }
        album: { type: string, maxLength: 64, description: "Id of an album you own (ADR 0019)." }
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry, in the future and at most one year ahead.
        password:
          type: string
          minLength: 4
          maxLength: 256
          description: Optional password visitors must enter.
    CreatedShare:
      type: object
      required: [id, token, expiresAt, hasPassword]
      properties:
        id: { type: string }
        token: { type: string, description: "Secret link token. Shown only once." }
        expiresAt: { type: [string, "null"], format: date-time }
        hasPassword: { type: boolean }
    PublicNode:
      type: object
      required: [id, name, kind, size, mime, updated]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [file, folder] }
        size: { type: integer }
        mime: { type: string }
        updated: { type: string }
    PublicMedia:
      type: object
      description: A photo or video of a shared album. No location or camera data is ever exposed.
      required: [id, kind, ready, width, height, duration, taken_at, name]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video] }
        ready: { type: boolean, description: Thumbnail and preview are available. }
        width: { type: integer }
        height: { type: integer }
        duration: { type: number }
        taken_at: { type: string }
        name: { type: string }
    PublicShare:
      type: object
      required: [expiresAt]
      properties:
        item:
          description: The shared file or folder (absent for albums).
          allOf: [{ $ref: "#/components/schemas/PublicNode" }]
        album:
          description: The shared album (album links only).
          type: object
          required: [name, owner]
          properties:
            name: { type: string }
            owner: { type: string, description: "Owner's display name (may be empty)." }
        media:
          type: array
          description: The album's photos and videos, newest first (album links only).
          items: { $ref: "#/components/schemas/PublicMedia" }
        expiresAt: { type: [string, "null"], format: date-time }
        folder:
          description: The folder being listed (shared folders only).
          allOf: [{ $ref: "#/components/schemas/PublicNode" }]
        path:
          type: array
          description: Folders from the shared root down to `folder`.
          items: { $ref: "#/components/schemas/PublicNode" }
        children:
          type: array
          items: { $ref: "#/components/schemas/PublicNode" }
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          type: object
          additionalProperties: true
