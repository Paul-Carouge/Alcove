<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The Alcove mark (docs/brand/alcove-mark.svg), with the dark theme's accent colours. -->
  <style>
    .tile { fill: #3F6B5A; }
